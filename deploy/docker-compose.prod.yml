# MediZen Clinic CMS — PRODUCTION stack.
#
# Runs the whole system from freshly-pulled source (see deploy.sh):
#   postgres + redis + api (FastAPI) + worker (Arq) + web (SPA served by nginx,
#   which reverse-proxies /api to the api service).
#
# Config comes from ./.env.prod (copy from .env.prod.example). NEVER commit .env.prod.
# TLS: terminate HTTPS in front of the `web` service (Caddy / Traefik / cloud LB).
#
# Usage:  ./deploy.sh        (pull + build + up)
#         docker compose -f docker-compose.prod.yml --env-file .env.prod ps

name: medizen-prod

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cms}
      POSTGRES_USER: ${POSTGRES_USER:-cms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./repos/backend/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cms} -d ${POSTGRES_DB:-cms}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./repos/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    # Migrate → seed superadmin (idempotent, non-fatal) → serve with N workers. No --reload, no demo seed.
    command:
      - /bin/sh
      - -c
      - "alembic upgrade head && (python scripts/seed_superadmin.py || echo 'superadmin seed skipped') && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers ${API_WORKERS:-4}"
    # API is reached internally by `web`; publish to localhost only for ops/debug.
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ./repos/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    command: ["arq", "app.workers.scheduler.WorkerSettings"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      disable: true

  web:
    build:
      context: ./repos/frontend
      dockerfile: Dockerfile.prod   # staged into the repo by deploy.sh
      args:
        # Empty → SPA calls /api relatively; nginx proxies it to the api service.
        VITE_API_URL: ""
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
